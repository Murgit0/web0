<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pong</title>
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body>
  <div class="box">
    <p>Create match, share ID, opponent joins via Worker API. Realtime via WebSocket (basic).</p>
    <input id="stake" value="10" /> stake
    <button class="btn" id="create">create match</button>
    <input id="matchId" placeholder="match id" />
    <button class="btn" id="join">join</button>
    <p id="status"></p>
    <a href="/games/">← games</a>
  </div>
  <script type="module">
    import { api } from '/js/api.js';
    import { requireAuthRedirect } from '/js/auth-ui.js';
    import { connectWs } from '/js/ws.js';
    if (!requireAuthRedirect()) throw 0;
    connectWs();
    document.getElementById('create').onclick = async () => {
      const r = await api('/games/match', { method: 'POST', body: JSON.stringify({ game: 'pong', stake: +document.getElementById('stake').value }) });
      document.getElementById('status').textContent = `Match: ${r.match_id}`;
      document.getElementById('matchId').value = r.match_id;
    };
    document.getElementById('join').onclick = async () => {
      const id = document.getElementById('matchId').value;
      const r = await api(`/games/match/${id}/join`, { method: 'POST', body: '{}' });
      document.getElementById('status').textContent = `Joined. Pot ${r.pot}`;
    };
  </script>
</body>
</html>
